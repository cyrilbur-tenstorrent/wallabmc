description: |
  Host power sequencer.

  power-on-sequence lists wallabmc,power-rail nodes in the order they are
  brought up: each rail waits for its power-good inputs to read inactive,
  drives its enable active, waits for them to read active and then waits
  its settle-ms. power-off-sequence lists them in the order they are taken
  down, usually the reverse; a rail with off-delay-ms is taken down that
  long after the rail before it. A failed power on takes down the rails
  that came up, in power-off-sequence order. The host reset GPIO (alias
  reset-gpio-1), if there is one, is asserted before the first rail comes
  up and released after the last. The fault inputs are watched while the
  host runs; one going active powers the host off.

  Example:

    power_sequencer: power-sequencer {
        compatible = "wallabmc,power-sequencer";
        power-on-sequence = <&p5v &vcore>;
        power-off-sequence = <&vcore &p5v>;
        fault = <&tj_max>;
    };

compatible: "wallabmc,power-sequencer"

include: base.yaml

properties:
  power-on-sequence:
    type: phandles
    required: true
    description: The wallabmc,power-rail nodes in power-on order.

  power-off-sequence:
    type: phandles
    required: true
    description: |
      The same rails in power-off order. Every rail in power-on-sequence
      must appear here.

  fault:
    type: phandles
    description: |
      Nodes with a gpios property that the host drives active to demand
      an immediate power off, such as a junction over-temperature line.
      Each is armed as an edge interrupt once the last rail is up and the
      host reset is released, and disarmed before the host is reset or
      powered off, so the level while the host is off or in reset does
      not matter. Every edge logs an error and walks power-off-sequence.
      The pin must be able to interrupt (on STM32 no other interrupt may
      use the same pin number); if arming fails the power on backs out.
