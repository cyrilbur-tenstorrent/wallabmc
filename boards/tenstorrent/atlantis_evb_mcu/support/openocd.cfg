#
# STM32F746 SWD through FT4232H channel A on the USB debug port (J39):
# ADBUS0 -> SWCLK, ADBUS1 (DO) -> SWDIO via 470R, ADBUS2 (DI) -> SWDIO.

adapter driver ftdi
ftdi vid_pid 0x0403 0x6011
ftdi channel 0
ftdi layout_init 0x0008 0x000b

# Dummy signals: SWD_EN is required for SWD, and SWDIO_OE makes the driver
# switch ADBUS1 to input while the target drives SWDIO.
ftdi layout_signal SWD_EN -data 0
ftdi layout_signal SWDIO_OE -data 0

transport select swd

source [find target/stm32f7x.cfg]

reset_config none
